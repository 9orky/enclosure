# Local architecture contract for this repository.
#
# New or refactored feature modules should use a small package seam plus
# domain.py, infrastructure.py, application.py, and ui.py when those
# responsibilities are needed. Legacy layer folders may remain until refactored.

architecture:
  language: python
  root: src/enclosure
  exclusions: [.venv/**, .enclosure/**, tests/**, libraries/**, __pycache__/**, "**/__pycache__/**", "**/__init__.py"]

  shape:
    max_classes_per_file: -1
    max_interfaces_per_file: -1
    max_types_per_file: -1
    max_abstract_classes_per_file: -1
    max_functions_per_file: -1
    max_methods_per_class: -1
    max_declared_args_per_function: -1
    max_declared_args_per_method: -1
    max_lines_count_per_function: -1
    max_lines_count_per_method: -1
    max_lines_count_per_class: -1
    # untouchable for agent begin
    allow_optional_function_args: false
    allow_optional_method_args: false
    allow_optional_class_properties: false
    allow_imports_aliases: false
    enforce_joined_imports: true
    allowed_imports_crossing_types: [module]
    # untouchable for agent end

  boundaries:
    tags:
      - { name: context, match: &context "*", except: ["__init__", "*/*/*"], exclude: [] }
      - { name: module, match: &module "*/*", except: ["*/__init__"], exclude: [] }
      - { name: module_api, match: &module_api "*/*/__init__", except: [], exclude: [] }
      - { name: domain, match: &domain "*/*/domain", except: [], exclude: [] }
      - { name: infrastructure, match: &infrastructure "*/*/infrastructure", except: [], exclude: [] }
      - { name: application, match: &application "*/*/application", except: [], exclude: [] }
      - { name: ui, match: &ui "*/*/ui", except: [], exclude: [] }

    rules:
      - { source: *context, disallow: [*context], allow: [*module_api], allow_same_match: false }
      - { source: *module, disallow: [*module], allow: [*module_api], allow_same_match: true }
      - { source: *domain, disallow: [*application, *infrastructure, *ui], allow: [], allow_same_match: false }
      - { source: *infrastructure, disallow: [*application, *ui], allow: [], allow_same_match: false }
      - { source: *application, disallow: [*ui], allow: [], allow_same_match: false }
      - { source: *ui, disallow: [*infrastructure], allow: [], allow_same_match: false }

    flow:
      layers: [ui, application, infrastructure, domain]
      realms:
        - { name: module, module_tag: module }
      analyzers: [backward-flow, no-cycles]

  map:
    top: -1
  pressure:
    top: 10
  clusters:
    group_depth: 5
    top: 20
    files_top: 5
  health:
    top: 5

workspace:
  guidance:
    max_template_chars: 1200
  recipe:
    skip:
      - "**/__pycache__/**"
      - "__pycache__/**"
    roles_map:
      features/architecture/boundaries: module-report-cli
      features/architecture/clusters: module-report-cli
      features/architecture/coherence: module-domain-package-cli
      features/architecture/health: module-report-cli
      features/architecture/map: module-report-cli
      features/architecture/pressure: module-report-cli
      features/architecture/shape: module-report-cli
      features/health/report: module-report-cli
      features/pattern/catalog: pattern-module
      features/pattern/fit: pattern-module
      features/workspace/health: module-report-cli
      features/workspace/plan: module-workspace-cli
      features/workspace/recipe: module-workspace-cli
      features/workspace/rules: module-domain-package-cli+slot-infrastructure-file
      features/workspace/sync: module-workspace-cli
  rules:
    local:
      max_content_chars: 1200
  sync: {}
