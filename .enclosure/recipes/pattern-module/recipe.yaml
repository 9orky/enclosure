schema_version: 1
role: archetype
description: Reusable local pattern feature module with one application use case per file, one domain concept per file, split infrastructure adapters, empty package seams, and no export hubs.
ladder:
  family: module
  rung: pattern-module
  slots:
    application:
      state: split-files
      files:
        - describe.py
        - preview.py
        - apply.py
        - validate.py
    domain:
      state: split-files
      files:
        - reference.py
        - report.py
    infrastructure:
      state: split-files
      files:
        - workspace.py
    ui:
      state: split-files
      files:
        - cli.py
        - templates/docs.tmpl
        - templates/llm.tmpl
        - templates/result.tmpl
files:
  - source: templates/__init__.py.tmpl
    target: "{{ target.path }}/__init__.py"
  - source: templates/application/__init__.py.tmpl
    target: "{{ target.path }}/application/__init__.py"
  - source: templates/application/describe.py.tmpl
    target: "{{ target.path }}/application/describe.py"
  - source: templates/application/preview.py.tmpl
    target: "{{ target.path }}/application/preview.py"
  - source: templates/application/apply.py.tmpl
    target: "{{ target.path }}/application/apply.py"
  - source: templates/application/validate.py.tmpl
    target: "{{ target.path }}/application/validate.py"
  - source: templates/domain/__init__.py.tmpl
    target: "{{ target.path }}/domain/__init__.py"
  - source: templates/domain/reference.py.tmpl
    target: "{{ target.path }}/domain/reference.py"
  - source: templates/domain/report.py.tmpl
    target: "{{ target.path }}/domain/report.py"
  - source: templates/infrastructure/__init__.py.tmpl
    target: "{{ target.path }}/infrastructure/__init__.py"
  - source: templates/infrastructure/workspace.py.tmpl
    target: "{{ target.path }}/infrastructure/workspace.py"
  - source: templates/ui/__init__.py.tmpl
    target: "{{ target.path }}/ui/__init__.py"
  - source: templates/ui/cli.py.tmpl
    target: "{{ target.path }}/ui/cli.py"
  - source: templates/ui/templates/docs.tmpl
    target: "{{ target.path }}/ui/templates/docs.tmpl"
  - source: templates/ui/templates/llm.tmpl
    target: "{{ target.path }}/ui/templates/llm.tmpl"
  - source: templates/ui/templates/result.tmpl
    target: "{{ target.path }}/ui/templates/result.tmpl"
