schema_version: 1
role: container
description: Container module recipe with the combined compact command/support tree.
archetypes:
  - module-all-packages-cli
  - module-application-actions-cli
  - module-application-cq-cli
  - module-application-package-cli
  - module-config-support
  - module-domain-package-infrastructure-cli
  - module-domain-package-cli
  - module-infrastructure-package-cli
  - module-report-cli
  - module-workspace-cli
files:
  - source: templates/__init__.py.tmpl
    target: "{{ target.path }}/__init__.py"
  - source: templates/application/__init__.py.tmpl
    target: "{{ target.path }}/application/__init__.py"
  - source: templates/application/commands.py.tmpl
    target: "{{ target.path }}/application/commands.py"
  - source: templates/application/commands/__init__.py.tmpl
    target: "{{ target.path }}/application/commands/__init__.py"
  - source: templates/application/queries.py.tmpl
    target: "{{ target.path }}/application/queries.py"
  - source: templates/application/queries/__init__.py.tmpl
    target: "{{ target.path }}/application/queries/__init__.py"
  - source: templates/application.py.tmpl
    target: "{{ target.path }}/application.py"
  - source: templates/domain.py.tmpl
    target: "{{ target.path }}/domain.py"
  - source: templates/domain/__init__.py.tmpl
    target: "{{ target.path }}/domain/__init__.py"
  - source: templates/infrastructure/__init__.py.tmpl
    target: "{{ target.path }}/infrastructure/__init__.py"
  - source: templates/infrastructure.py.tmpl
    target: "{{ target.path }}/infrastructure.py"
  - source: templates/ui/__init__.py.tmpl
    target: "{{ target.path }}/ui/__init__.py"
  - source: templates/ui/cli.py.tmpl
    target: "{{ target.path }}/ui/cli.py"
  - source: templates/ui/templates/docs.tmpl
    target: "{{ target.path }}/ui/templates/docs.tmpl"
  - source: templates/ui/templates/llm.tmpl
    target: "{{ target.path }}/ui/templates/llm.tmpl"
  - source: templates/ui/templates/report.tmpl
    target: "{{ target.path }}/ui/templates/report.tmpl"
