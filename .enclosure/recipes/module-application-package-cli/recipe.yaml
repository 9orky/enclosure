schema_version: 1
role: archetype
description: Command module with packaged application, compact domain, UI package, and docs/llm/report templates.
ladder:
  family: module
  rung: application-package-cli
  slots:
    application: package
    domain: file
    infrastructure: absent
    ui: package
files:
  - source: templates/__init__.py.tmpl
    target: "{{ target.path }}/__init__.py"
  - source: templates/application/__init__.py.tmpl
    target: "{{ target.path }}/application/__init__.py"
  - source: templates/domain.py.tmpl
    target: "{{ target.path }}/domain.py"
  - source: templates/ui/__init__.py.tmpl
    target: "{{ target.path }}/ui/__init__.py"
  - source: templates/ui/cli.py.tmpl
    target: "{{ target.path }}/ui/cli.py"
  - source: templates/ui/templates/docs.tmpl
    target: "{{ target.path }}/ui/templates/docs.tmpl"
  - source: templates/ui/templates/llm.tmpl
    target: "{{ target.path }}/ui/templates/llm.tmpl"
  - source: templates/ui/templates/report.tmpl
    target: "{{ target.path }}/ui/templates/report.tmpl"
